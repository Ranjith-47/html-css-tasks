<!DOCTYPE html>
<html>
<head>
<title>Progress Bar</title>
<style>
.bar{
    width:300px;
    height:30px;
    border:1px solid black;
}

.fill{
    width:70%;
    height:30px;
    background-color:green;
    text-align:center;
    color:white;
}
</style>
</head>
<body>

<h2>Progress</h2>

<div class="bar">
    <div class="fill">70%</div>
</div>

</body>
</html>
